name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  # The job name `verify` is referenced by Vercel Deployment Checks.
  # Renaming it means updating the check in the Vercel project settings.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build # includes tsc -b
